<div class="container">
  <div class="content-area">

    <h2>Issues</h2>

    <table class="report-table" *ngIf="issues.length > 0">
      <thead>
        <tr>
          <th>Department</th>
          <th>Description</th>
          <th>Location</th>
          <th>Status</th>
          <th *ngIf="isAdmin">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let issue of issues">
          <td>{{ issue.issueDept }}</td>
          <td>{{ issue.description }}</td>
          <td>{{ issue.location }}</td>

          <!-- USER VIEW -->
          <td *ngIf="!isAdmin">
            <span class="status-badge" [ngClass]="getStatusClass(issue.status)">
              {{ issue.status }}
            </span>
          </td>

          <!-- ADMIN VIEW -->
          <td *ngIf="isAdmin">
            <select [(ngModel)]="issue.status">
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </td>

          <td *ngIf="isAdmin">
            <button class="register-btn" (click)="updateStatus(issue)">
              Save
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <p *ngIf="issues.length === 0">No issues found.</p>

  </div>
</div>
