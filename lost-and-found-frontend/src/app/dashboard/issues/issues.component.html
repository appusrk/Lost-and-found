<div class="container">
  <div class="content-area">

    <h2>Issues</h2>

    <p *ngIf="issues.length === 0">No issues found.</p>

    <table *ngIf="issues.length > 0" class="report-table">
      <thead>
        <tr>
          <th>Department</th>
          <th>Description</th>
          <th>Location</th>
          <th>Status</th>
          <th *ngIf="isAdmin">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let issue of issues">

          <td>{{ issue.issueDept }}</td>
          <td>{{ issue.description }}</td>
          <td>{{ issue.location }}</td>

          <!-- ✅ NORMAL USER: COLORED BADGE -->
          <td *ngIf="!isAdmin">
            <span
              class="status-badge"
              [ngClass]="{
                'status-open': issue.status === 'Open',
                'status-progress': issue.status === 'In Progress',
                'status-resolved': issue.status === 'Resolved'
              }"
            >
              {{ issue.status }}
            </span>
          </td>

          <!-- ✅ ADMIN: DROPDOWN -->
          <td *ngIf="isAdmin">
            <select [(ngModel)]="issue.status">
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </td>

          <!-- ✅ ADMIN ACTION -->
          <td *ngIf="isAdmin">
            <button class="register-btn" (click)="updateStatus(issue)">
              Save
            </button>
          </td>

        </tr>
      </tbody>
    </table>

  </div>
</div>
